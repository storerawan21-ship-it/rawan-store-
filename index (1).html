<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rawan Store | روان ستور</title>
<style>
  :root{--pink:#d6247f;--pink-dark:#b01a68;--green:#bff0c8;--green-soft:#e9fbed;--ink:#2b2b2b}
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;
    font-family:"Segoe UI",Tahoma,Arial,sans-serif;
    background:linear-gradient(180deg,var(--green) 0%,var(--green-soft) 55%,#fff 100%);
    color:var(--ink);
    display:flex;justify-content:center;
    padding:32px 16px 40px;
  }
  .card{width:100%;max-width:420px;text-align:center}
  .logo{
    display:block;width:100%;max-width:300px;height:auto;
    margin:0 auto 18px;border-radius:24px;
    border:5px solid #fff;
    box-shadow:0 6px 18px rgba(214,36,127,.25);
  }
  h1{font-size:26px;color:var(--pink-dark);margin-bottom:4px}
  .tag{font-size:15px;color:#4a7a55;margin-bottom:6px}
  .sub{font-size:14px;color:#666;margin-bottom:26px}
  a.btn{
    display:flex;align-items:center;justify-content:center;gap:10px;
    width:100%;padding:16px 18px;margin-bottom:14px;
    border-radius:16px;text-decoration:none;
    font-size:18px;font-weight:600;color:#fff;
    box-shadow:0 4px 12px rgba(0,0,0,.12);
    transition:transform .12s ease;
  }
  a.btn:active{transform:scale(.97)}
  .wa{background:#25d366}
  .fb{background:#1877f2}
  .ig{background:linear-gradient(45deg,#f09433,#dc2743 55%,#bc1888)}
  .tt{background:#111}
  svg{width:24px;height:24px;fill:#fff;flex:none}
  footer{margin-top:22px;font-size:13px;color:#7a7a7a}
</style>
</head>
